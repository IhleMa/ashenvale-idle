# nginx reverse proxy for Ashenvale Idle (HTTP + WebSocket)
#
# 1. Replace  play.example.com  with your subdomain
# 2. Replace  127.0.0.1:25565   with the IP:port of your Pterodactyl allocation
#    (shown in the panel under Network; use the IP exactly as it is listed there, e.g. 0.0.0.0 → 127.0.0.1)
# 3. Copy to /etc/nginx/sites-available/ashenvale.conf, enable it, then run:
#       sudo certbot --nginx -d play.example.com
#    certbot adds the HTTPS (port 443) part and the HTTP → HTTPS redirect automatically.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;

    location / {
        proxy_pass http://127.0.0.1:25565;
        proxy_http_version 1.1;

        # WebSocket support (the game uses /ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # keep idle game connections open
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
